name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev] || (
            # 如果 poetry 安装失败，退回到直接安装核心依赖
            pip install pytest pytest-asyncio pytest-cov ruff mypy
            pip install tree-sitter tree-sitter-python tree-sitter-javascript \
                        tree-sitter-typescript tree-sitter-java tree-sitter-go
            pip install "litellm>=1.50,<1.60" langgraph pydantic pydantic-settings
            pip install gitpython typer rich structlog httpx tenacity
            pip install legacy-cgi
            pip install -e . --no-deps
          )

      - name: Run tests
        run: |
          python -m pytest tests/ -v \
            --cov=cra \
            --cov-report=term-missing \
            --cov-report=xml \
            --junitxml=pytest.xml

      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml

  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install linters
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy

      - name: Ruff check
        run: ruff check src/ tests/ || true  # MVP 阶段先 warning，不阻断

      - name: Ruff format check
        run: ruff format --check src/ tests/ || true

      - name: Mypy type check
        run: mypy src/cra/ --ignore-missing-imports || true
        continue-on-error: true
