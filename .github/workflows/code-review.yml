name: AI Code Review
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
  security-events: write
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: yyz-afk/code-review-agent@main
        with:
          api_key: ${{ secrets.CRA_API_KEY }}          #${{ secrets.CRA_API_KEY }}
          model: "deepseek/deepseek-v4-pro"           # 模型名（见第 5 节）
          api_base: ""                              # 自定义 API Base（兼容接口用）
          base: ""                                  # 留空则自动用 PR base
          head: "HEAD"                              # 默认 HEAD
          agents: "correctness,security,performance,architecture"
          fail_on_high: "false"                     # true: 有 critical/high 则失败
          upload_sarif: "true"                      # false: 不上传到 Code Scanning