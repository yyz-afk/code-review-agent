[tool.poetry]
name = "code-review-agent"
version = "0.1.0"
description = "基于 LLM Agent 的企业级 AI 代码审查系统"
authors = ["Code Review Team"]
readme = "README.md"
packages = [{include = "cra", from = "src"}]

[tool.poetry.dependencies]
python = "^3.12"
# 代码解析
tree-sitter = ">=0.25,<1.0"
tree-sitter-python = ">=0.25,<1.0"
tree-sitter-javascript = ">=0.23,<1.0"
tree-sitter-typescript = ">=0.23,<1.0"
tree-sitter-java = ">=0.23,<1.0"
tree-sitter-go = ">=0.23,<1.0"
# LLM 调用
litellm = ">=1.50,<1.60"
# Python 3.13 兼容（cgi 模块被移除）
legacy-cgi = {version = ">=2.6", markers = "python_version >= '3.13'"}
# Agent 编排
langgraph = ">=1.0,<2.0"
# 数据校验
pydantic = ">=2.0,<3.0"
pydantic-settings = ">=2.0,<3.0"
# Git 操作
gitpython = ">=3.1,<4.0"
# CLI
typer = ">=0.12,<1.0"
rich = ">=13.0,<14.0"
# 日志
structlog = ">=24.0,<25.0"
# HTTP（LiteLLM 依赖，显式声明便于排查）
httpx = ">=0.27,<1.0"
# 重试
tenacity = ">=8.0,<10.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0,<9.0"
pytest-asyncio = ">=0.23,<1.0"
pytest-cov = ">=5.0,<6.0"
ruff = ">=0.6,<1.0"
mypy = ">=1.10,<2.0"
pre-commit = ">=3.7,<4.0"

[tool.poetry.scripts]
code-review = "cra.cli.main:app"

# ============================================================
# 工具配置
# ============================================================

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "RUF",  # ruff-specific
]
ignore = ["E501"]  # 行长由 formatter 管

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = false
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false  # MVP 阶段放宽，后续收紧
ignore_missing_imports = true  # 第三方库无 stub

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = [
    "--strict-markers",
    "--cov=cra",
    "--cov-report=term-missing",
    "--cov-report=html:htmlcov",
    "--cov-fail-under=50",
]

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"
